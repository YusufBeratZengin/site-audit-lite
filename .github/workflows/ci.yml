name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        include:
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Tests with coverage
        if: matrix.os != 'ubuntu-latest' || matrix.node != 24
        run: npm test
      - name: Enforce 85% source line coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: npm run test:coverage
      - run: npm pack --dry-run
